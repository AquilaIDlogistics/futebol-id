<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Futebol ID</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f9;
    color: #172033;
}

header {
    background: #071d49;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

header button {
    width: auto;
    margin: 0;
    padding: 9px 15px;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1,
h2,
h3 {
    color: #071d49;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(240px, 1fr)
    );
    gap: 18px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    background: #071d49;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 0;
}

button:hover {
    background: #0d347d;
}

.btn-danger {
    background: #c62828;
}

.btn-success {
    background: #16834b;
}

.btn-secondary {
    background: #e8edf5;
    color: #071d49;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 14px;
    border: 1px solid #ccd3df;
    border-radius: 8px;
    font-size: 15px;
}

label {
    font-weight: bold;
    display: block;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 11px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #071d49;
    color: white;
}

.hidden {
    display: none !important;
}

.menu {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.menu button {
    flex: 1;
    min-width: 150px;
}

.login {
    max-width: 430px;
    margin: 70px auto;
}

.logo-big {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    color: #071d49;
    margin-bottom: 25px;
}

.alert {
    padding: 13px;
    border-radius: 8px;
    margin-bottom: 15px;
    background: #eef3fa;
}

.jogador-card {
    border: 1px solid #e1e5ec;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 10px;
}

.nota {
    font-size: 25px;
    font-weight: bold;
    color: #071d49;
}

.ranking-posicao {
    font-size: 28px;
    font-weight: bold;
}

@media(max-width:650px) {

    main {
        padding: 15px;
    }

    header {
        padding: 14px;
    }

    .logo {
        font-size: 20px;
    }

    table {
        font-size: 13px;
    }

}

</style>

</head>

<body>

<header id="topo" class="hidden">

    <div class="logo">
        ⚽ Futebol ID
    </div>

    <div>
        <span id="usuarioNome"></span>
        <button onclick="logout()">Sair</button>
    </div>

</header>


<!-- LOGIN -->

<section id="telaLogin" class="login">

    <div class="logo-big">
        ⚽ Futebol ID
    </div>

    <div class="card">

        <h2>Entrar</h2>

        <div id="loginMensagem"></div>

        <label>Usuário / E-mail</label>

        <input
            id="loginUsuario"
            placeholder="Digite seu usuário"
        >

        <label>Senha</label>

        <input
            id="loginSenha"
            type="password"
            placeholder="Digite sua senha"
        >

        <button onclick="login()">
            Entrar
        </button>

    </div>

</section>


<!-- SISTEMA -->

<main id="sistema" class="hidden">

    <div class="menu">

        <button onclick="mostrarTela('dashboard')">
            🏠 Início
        </button>

        <button onclick="mostrarTela('jogadores')">
            👥 Jogadores
        </button>

        <button onclick="mostrarTela('partidas')">
            ⚽ Partidas
        </button>

        <button onclick="mostrarTela('escalacao')">
            📋 Escalação
        </button>

        <button onclick="mostrarTela('votacao')">
            ⭐ Votação
        </button>

        <button onclick="mostrarTela('ranking')">
            🏆 Ranking
        </button>

    </div>


    <!-- DASHBOARD -->

    <section id="dashboard" class="tela">

        <div class="card">

            <h1>Futebol ID</h1>

            <p>
                Bem-vindo ao sistema.
            </p>

            <div class="grid">

                <div class="card">
                    <h3>👥 Jogadores</h3>
                    <h2 id="totalJogadores">0</h2>
                </div>

                <div class="card">
                    <h3>⚽ Partidas</h3>
                    <h2 id="totalPartidas">0</h2>
                </div>

                <div class="card">
                    <h3>🏆 Ranking</h3>
                    <h2>Ver ranking</h2>
                    <button onclick="mostrarTela('ranking')">
                        Abrir
                    </button>
                </div>

            </div>

        </div>

    </section>


    <!-- JOGADORES -->

    <section id="jogadores" class="tela hidden">

        <div class="card">

            <h1>👥 Jogadores</h1>

            <button onclick="mostrarCadastro()">
                + Novo jogador
            </button>

            <div id="formJogador" class="hidden">

                <h3>Cadastro</h3>

                <input id="jNome" placeholder="Nome">

                <input id="jApelido" placeholder="Apelido">

                <select id="jPosicao">

                    <option value="">Posição</option>
                    <option>Goleiro</option>
                    <option>Zagueiro</option>
                    <option>Lateral</option>
                    <option>Volante</option>
                    <option>Meia</option>
                    <option>Ponta</option>
                    <option>Atacante</option>

                </select>

                <input id="jNumero" placeholder="Número">

                <input id="jEmail" placeholder="E-mail">

                <input
                    id="jSenha"
                    type="password"
                    placeholder="Senha"
                >

                <button onclick="cadastrarJogador()">
                    Salvar jogador
                </button>

                <button
                    class="btn-secondary"
                    onclick="esconderCadastro()"
                >
                    Cancelar
                </button>

            </div>

            <div id="listaJogadores"></div>

        </div>

    </section>


    <!-- PARTIDAS -->

    <section id="partidas" class="tela hidden">

        <div class="card">

            <h1>⚽ Partidas</h1>

            <h3>Nova partida</h3>

            <label>Data</label>

            <input id="pData" type="date">

            <label>Hora</label>

            <input id="pHora" type="time">

            <label>Adversário</label>

            <input
                id="pAdversario"
                placeholder="Nome do adversário"
            >

            <label>Local</label>

            <input
                id="pLocal"
                placeholder="Local da partida"
            >

            <button onclick="criarPartida()">
                Criar partida
            </button>

        </div>

        <div class="card">

            <h2>Partidas cadastradas</h2>

            <div id="listaPartidas"></div>

        </div>

    </section>


    <!-- ESCALAÇÃO -->

    <section id="escalacao" class="tela hidden">

        <div class="card">

            <h1>📋 Escalação</h1>

            <label>Partida</label>

            <select id="selectPartidaEscala"
                    onchange="carregarEscalados()">
            </select>

            <h3>Adicionar jogador</h3>

            <select id="selectJogadorEscala">
            </select>

            <button onclick="escalarJogador()">
                Escalar jogador
            </button>

            <div id="listaEscalados"></div>

        </div>

    </section>


    <!-- VOTAÇÃO -->

    <section id="votacao" class="tela hidden">

        <div class="card">

            <h1>⭐ Votação</h1>

            <label>Partida</label>

            <select id="selectPartidaVoto"
                    onchange="carregarVotacao()">
            </select>

            <div id="painelVotacao"></div>

        </div>

    </section>


    <!-- RANKING -->

    <section id="ranking" class="tela hidden">

        <div class="card">

            <h1>🏆 Ranking</h1>

            <button onclick="carregarRanking()">
                Atualizar ranking
            </button>

            <div id="listaRanking"></div>

        </div>

    </section>

</main>


<script>

/*******************************************************
 * CONFIGURAÇÃO
 *******************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbzd-B7jCN_YhM7QOh_cHvad-4icVrTAuMQ_gp2Xx7y95ctNO5258G2-zLfwWWq2C1sN/exec";


let usuario = null;

let jogadores = [];

let partidas = [];

let escalados = [];


/*******************************************************
 * API
 *******************************************************/

async function api(acao, parametros = {}) {

    const params = new URLSearchParams();

    params.append("acao", acao);

    Object.keys(parametros).forEach(chave => {

        params.append(
            chave,
            parametros[chave] ?? ""
        );

    });

    const resposta =
        await fetch(API_URL + "?" + params.toString());

    return await resposta.json();

}


/*******************************************************
 * LOGIN
 *******************************************************/

async function login() {

    const usuarioInput =
        document.getElementById("loginUsuario").value;

    const senha =
        document.getElementById("loginSenha").value;

    const mensagem =
        document.getElementById("loginMensagem");

    mensagem.innerHTML =
        "Entrando...";

    try {

        const resultado =
            await api(
                "login",
                {
                    email: usuarioInput,
                    senha: senha
                }
            );

        if (!resultado.ok) {

            mensagem.innerHTML =
                `<div class="alert">
                    ❌ ${resultado.erro}
                </div>`;

            return;

        }

        usuario = resultado.jogador;

        localStorage.setItem(
            "futebolID_usuario",
            JSON.stringify(usuario)
        );

        entrarSistema();

    } catch (erro) {

        mensagem.innerHTML =
            `<div class="alert">
                ❌ Erro de conexão.
            </div>`;

    }

}


function entrarSistema() {

    document
        .getElementById("telaLogin")
        .classList.add("hidden");

    document
        .getElementById("topo")
        .classList.remove("hidden");

    document
        .getElementById("sistema")
        .classList.remove("hidden");

    document
        .getElementById("usuarioNome")
        .textContent =
        usuario.nome;

    carregarTudo();

}


function logout() {

    localStorage.removeItem(
        "futebolID_usuario"
    );

    location.reload();

}


/*******************************************************
 * TELAS
 *******************************************************/

function mostrarTela(id) {

    document
        .querySelectorAll(".tela")
        .forEach(tela => {
            tela.classList.add("hidden");
        });

    document
        .getElementById(id)
        .classList.remove("hidden");

    if (id === "jogadores") {
        carregarJogadores();
    }

    if (id === "partidas") {
        carregarPartidas();
    }

    if (id === "escalacao") {
        carregarDadosEscalacao();
    }

    if (id === "votacao") {
        carregarDadosVotacao();
    }

    if (id === "ranking") {
        carregarRanking();
    }

}


/*******************************************************
 * CARREGAR TUDO
 *******************************************************/

async function carregarTudo() {

    await carregarJogadores();

    await carregarPartidas();

    atualizarDashboard();

}


/*******************************************************
 * JOGADORES
 *******************************************************/

async function carregarJogadores() {

    const resultado =
        await api("jogadores");

    if (!resultado.ok) {
        return;
    }

    jogadores =
        resultado.jogadores;

    atualizarDashboard();

    renderJogadores();

    preencherJogadoresEscala();

}


function renderJogadores() {

    const div =
        document.getElementById(
            "listaJogadores"
        );

    if (!jogadores.length) {

        div.innerHTML =
            "<p>Nenhum jogador cadastrado.</p>";

        return;

    }

    let html =
        `<table>
            <tr>
                <th>Nome</th>
                <th>Apelido</th>
                <th>Posição</th>
                <th>Número</th>
                <th>Ações</th>
            </tr>`;

    jogadores
        .filter(j => j.ativo === "SIM")
        .forEach(j => {

            html += `
                <tr>

                    <td>${j.nome}</td>

                    <td>${j.apelido || "-"}</td>

                    <td>${j.posicao || "-"}</td>

                    <td>${j.numero || "-"}</td>

                    <td>

                        <button
                            onclick="desativarJogador('${j.id}')"
                            class="btn-danger"
                        >
                            Desativar
                        </button>

                    </td>

                </tr>
            `;

        });

    html += "</table>";

    div.innerHTML = html;

}


function mostrarCadastro() {

    document
        .getElementById("formJogador")
        .classList.remove("hidden");

}


function esconderCadastro() {

    document
        .getElementById("formJogador")
        .classList.add("hidden");

}


async function cadastrarJogador() {

    const resultado =
        await api(
            "cadastrar_jogador",
            {
                nome:
                    document.getElementById("jNome").value,

                apelido:
                    document.getElementById("jApelido").value,

                posicao:
                    document.getElementById("jPosicao").value,

                numero:
                    document.getElementById("jNumero").value,

                email:
                    document.getElementById("jEmail").value,

                senha:
                    document.getElementById("jSenha").value
            }
        );

    alert(
        resultado.ok
            ? "Jogador cadastrado!"
            : resultado.erro
    );

    if (resultado.ok) {

        document.getElementById("jNome").value = "";
        document.getElementById("jApelido").value = "";
        document.getElementById("jPosicao").value = "";
        document.getElementById("jNumero").value = "";
        document.getElementById("jEmail").value = "";
        document.getElementById("jSenha").value = "";

        esconderCadastro();

        carregarJogadores();

    }

}


async function desativarJogador(id) {

    if (!confirm("Deseja desativar este jogador?")) {
        return;
    }

    const resultado =
        await api(
            "excluir_jogador",
            {
                id: id
            }
        );

    alert(
        resultado.ok
            ? "Jogador desativado."
            : resultado.erro
    );

    carregarJogadores();

}


/*******************************************************
 * PARTIDAS
 *******************************************************/

async function carregarPartidas() {

    const resultado =
        await api("partidas");

    if (!resultado.ok) {
        return;
    }

    partidas =
        resultado.partidas;

    atualizarDashboard();

    renderPartidas();

    preencherPartidas();

}


function renderPartidas() {

    const div =
        document.getElementById(
            "listaPartidas"
        );

    if (!partidas.length) {

        div.innerHTML =
            "<p>Nenhuma partida cadastrada.</p>";

        return;

    }

    let html =
        `<table>
            <tr>
                <th>Data</th>
                <th>Hora</th>
                <th>Adversário</th>
                <th>Local</th>
                <th>Votação</th>
                <th>Ações</th>
            </tr>`;

    partidas.forEach(p => {

        html += `
            <tr>

                <td>${p.data}</td>

                <td>${p.hora || "-"}</td>

                <td>${p.adversario || "-"}</td>

                <td>${p.local || "-"}</td>

                <td>${p.votacao}</td>

                <td>

                    ${
                        p.votacao === "ABERTA"

                        ?

                        `<button
                            onclick="encerrarVotacao('${p.id}')"
                        >
                            Encerrar votação
                        </button>`

                        :

                        `<button
                            onclick="abrirVotacao('${p.id}')"
                            class="btn-success"
                        >
                            Abrir votação
                        </button>`
                    }

                    <button
                        onclick="excluirPartida('${p.id}')"
                        class="btn-danger"
                    >
                        Excluir
                    </button>

                </td>

            </tr>
        `;

    });

    html += "</table>";

    div.innerHTML = html;

}


async function criarPartida() {

    const resultado =
        await api(
            "criar_partida",
            {
                data:
                    document.getElementById("pData").value,

                hora:
                    document.getElementById("pHora").value,

                adversario:
                    document.getElementById("pAdversario").value,

                local:
                    document.getElementById("pLocal").value
            }
        );

    alert(
        resultado.ok
            ? "Partida criada!"
            : resultado.erro
    );

    if (resultado.ok) {

        document.getElementById("pData").value = "";
        document.getElementById("pHora").value = "";
        document.getElementById("pAdversario").value = "";
        document.getElementById("pLocal").value = "";

        carregarPartidas();

    }

}


async function excluirPartida(id) {

    if (!confirm("Excluir esta partida?")) {
        return;
    }

    const resultado =
        await api(
            "excluir_partida",
            {
                id: id
            }
        );

    alert(
        resultado.ok
            ? "Partida excluída."
            : resultado.erro
    );

    carregarPartidas();

}


/*******************************************************
 * ESCALAÇÃO
 *******************************************************/

function preencherPartidas() {

    const selects = [
        "selectPartidaEscala",
        "selectPartidaVoto"
    ];

    selects.forEach(id => {

        const select =
            document.getElementById(id);

        if (!select) {
            return;
        }

        select.innerHTML =
            `<option value="">
                Selecione uma partida
            </option>`;

        partidas.forEach(p => {

            const option =
                document.createElement("option");

            option.value = p.id;

            option.textContent =
                `${p.data} - ${p.adversario || "Partida"}`;

            select.appendChild(option);

        });

    });

}


function preencherJogadoresEscala() {

    const select =
        document.getElementById(
            "selectJogadorEscala"
        );

    if (!select) {
        return;
    }

    select.innerHTML =
        `<option value="">
            Selecione o jogador
        </option>`;

    jogadores
        .filter(j => j.ativo === "SIM")
        .forEach(j => {

            const option =
                document.createElement("option");

            option.value = j.id;

            option.textContent =
                `${j.nome} - ${j.posicao || ""}`;

            select.appendChild(option);

        });

}


async function carregarDadosEscalacao() {

    preencherPartidas();

    preencherJogadoresEscala();

}


async function carregarEscalados() {

    const partidaId =
        document.getElementById(
            "selectPartidaEscala"
        ).value;

    if (!partidaId) {
        return;
    }

    const resultado =
        await api(
            "escalados",
            {
                partida_id: partidaId
            }
        );

    if (!resultado.ok) {
        return;
    }

    escalados =
        resultado.escalados;

    renderEscalados();

}


function renderEscalados() {

    const div =
        document.getElementById(
            "listaEscalados"
        );

    if (!escalados.length) {

        div.innerHTML =
            "<p>Nenhum jogador escalado.</p>";

        return;

    }

    let html =
        "<h3>Jogadores escalados</h3>";

    escalados.forEach(j => {

        html += `
            <div class="jogador-card">

                <strong>
                    ${j.nome}
                </strong>

                <br>

                ${j.posicao || ""}

                ${
                    j.numero
                    ? " • #" + j.numero
                    : ""
                }

                <br>

                <button
                    onclick="desescalar('${j.jogadorId}')"
                    class="btn-danger"
                >
                    Retirar
                </button>

            </div>
        `;

    });

    div.innerHTML = html;

}


async function escalarJogador() {

    const partidaId =
        document.getElementById(
            "selectPartidaEscala"
        ).value;

    const jogadorId =
        document.getElementById(
            "selectJogadorEscala"
        ).value;

    if (!partidaId || !jogadorId) {

        alert(
            "Selecione a partida e o jogador."
        );

        return;

    }

    const resultado =
        await api(
            "escalar",
            {
                partida_id: partidaId,
                jogador_id: jogadorId
            }
        );

    alert(
        resultado.ok
            ? "Jogador escalado!"
            : resultado.erro
    );

    carregarEscalados();

}


async function desescalar(jogadorId) {

    const partidaId =
        document.getElementById(
            "selectPartidaEscala"
        ).value;

    const resultado =
        await api(
            "desescalar",
            {
                partida_id: partidaId,
                jogador_id: jogadorId
            }
        );

    alert(
        resultado.ok
            ? "Jogador retirado."
            : resultado.erro
    );

    carregarEscalados();

}


/*******************************************************
 * VOTAÇÃO
 *******************************************************/

function carregarDadosVotacao() {

    preencherPartidas();

}


async function carregarVotacao() {

    const partidaId =
        document.getElementById(
            "selectPartidaVoto"
        ).value;

    const painel =
        document.getElementById(
            "painelVotacao"
        );

    if (!partidaId) {

        painel.innerHTML =
            "";

        return;

    }

    const partida =
        partidas.find(
            p => String(p.id) === String(partidaId)
        );

    if (!partida) {
        return;
    }

    const resultado =
        await api(
            "escalados",
            {
                partida_id: partidaId
            }
        );

    if (!resultado.ok) {
        return;
    }

    const lista =
        resultado.escalados;

    if (partida.votacao !== "ABERTA") {

        painel.innerHTML =
            `<div class="alert">
                🔒 A votação está fechada.
            </div>`;

        return;

    }

    if (!lista.length) {

        painel.innerHTML =
            `<div class="alert">
                Nenhum jogador escalado.
            </div>`;

        return;

    }

    let html =
        "<h3>Avalie os jogadores</h3>";

    lista.forEach(j => {

        if (
            String(j.jogadorId) ===
            String(usuario.id)
        ) {

            return;

        }

        html += `
            <div class="jogador-card">

                <strong>
                    ${j.nome}
                </strong>

                <br>

                ${j.posicao || ""}

                <br><br>

                <select
                    id="nota_${j.jogadorId}"
                >

                    <option value="">
                        Escolha a nota
                    </option>

                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

                <button
                    onclick="votar('${j.jogadorId}')"
                >
                    Enviar nota
                </button>

            </div>
        `;

    });

    painel.innerHTML = html;

}


async function votar(avaliadoId) {

    const partidaId =
        document.getElementById(
            "selectPartidaVoto"
        ).value;

    const nota =
        document.getElementById(
            "nota_" + avaliadoId
        ).value;

    if (nota === "") {

        alert("Escolha uma nota.");

        return;

    }

    const resultado =
        await api(
            "votar",
            {
                partida_id: partidaId,
                jogador_id: usuario.id,
                avaliado_id: avaliadoId,
                nota: nota
            }
        );

    alert(
        resultado.ok
            ? "Nota registrada!"
            : resultado.erro
    );

    if (resultado.ok) {

        document.getElementById(
            "nota_" + avaliadoId
        ).value = "";

    }

}


async function abrirVotacao(id) {

    const resultado =
        await api(
            "abrir_votacao",
            {
                partida_id: id
            }
        );

    alert(
        resultado.ok
            ? "Votação aberta!"
            : resultado.erro
    );

    carregarPartidas();

}


async function encerrarVotacao(id) {

    const resultado =
        await api(
            "encerrar_votacao",
            {
                partida_id: id
            }
        );

    alert(
        resultado.ok
            ? "Votação encerrada!"
            : resultado.erro
    );

    carregarPartidas();

}


/*******************************************************
 * RANKING
 *******************************************************/

async function carregarRanking() {

    const div =
        document.getElementById(
            "listaRanking"
        );

    div.innerHTML =
        "Carregando ranking...";

    const resultado =
        await api("ranking");

    if (!resultado.ok) {

        div.innerHTML =
            "Erro ao carregar ranking.";

        return;

    }

    const lista =
        resultado.ranking;

    if (!lista.length) {

        div.innerHTML =
            "<p>Ainda não existem avaliações.</p>";

        return;

    }

    let html =
        `<table>

            <tr>
                <th>#</th>
                <th>Jogador</th>
                <th>Posição</th>
                <th>Média</th>
                <th>Votos</th>
            </tr>`;

    lista.forEach((j, index) => {

        html += `
            <tr>

                <td>
                    <span class="ranking-posicao">
                        ${index + 1}
                    </span>
                </td>

                <td>
                    <strong>${j.nome}</strong>
                    ${
                        j.apelido
                        ? "<br>" + j.apelido
                        : ""
                    }
                </td>

                <td>
                    ${j.posicao || "-"}
                </td>

                <td>
                    <span class="nota">
                        ${j.media.toFixed(2)}
                    </span>
                </td>

                <td>
                    ${j.votos}
                </td>

            </tr>
        `;

    });

    html += "</table>";

    div.innerHTML = html;

}
