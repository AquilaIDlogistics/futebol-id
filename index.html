<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Futebol ID</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f9;
    color: #172033;
}

header {
    background: #071d49;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

header button {
    width: auto;
    margin: 0;
    padding: 9px 15px;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1,
h2,
h3 {
    color: #071d49;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(240px, 1fr)
    );
    gap: 18px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    background: #071d49;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 0;
}

button:hover {
    background: #0d347d;
}

.btn-danger {
    background: #c62828;
}

.btn-success {
    background: #16834b;
}

.btn-secondary {
    background: #e8edf5;
    color: #071d49;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 14px;
    border: 1px solid #ccd3df;
    border-radius: 8px;
    font-size: 15px;
}

label {
    font-weight: bold;
    display: block;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 11px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #071d49;
    color: white;
}

.hidden {
    display: none !important;
}

.menu {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.menu button {
    flex: 1;
    min-width: 150px;
}

.login {
    max-width: 430px;
    margin: 70px auto;
}

.logo-big {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    color: #071d49;
    margin-bottom: 25px;
}

.alert {
    padding: 13px;
    border-radius: 8px;
    margin-bottom: 15px;
    background: #eef3fa;
}

.jogador-card {
    border: 1px solid #e1e5ec;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 10px;
}

.nota {
    font-size: 25px;
    font-weight: bold;
    color: #071d49;
}

.ranking-posicao {
    font-size: 28px;
    font-weight: bold;
}

@media(max-width:650px) {

    main {
        padding: 15px;
    }

    header {
        padding: 14px;
    }

    .logo {
        font-size: 20px;
    }

    table {
        font-size: 13px;
    }

}

</style>

</head>

<body>


<header id="topo" class="hidden">

    <div class="logo">
        ⚽ Futebol ID
    </div>

    <div>
        <span id="usuarioNome"></span>

        <button onclick="logout()">
            Sair
        </button>
    </div>

</header>



<!-- LOGIN -->

<section id="telaLogin" class="login">

    <div class="logo-big">
        ⚽ Futebol ID
    </div>

    <div class="card">

        <h2>Entrar</h2>

        <div id="loginMensagem"></div>

        <label>
            Usuário / E-mail
        </label>

        <input
            id="loginUsuario"
            placeholder="Digite seu usuário"
            autocomplete="username"
        >

        <label>
            Senha
        </label>

        <input
            id="loginSenha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
        >

        <button
            onclick="login()"
            id="btnLogin"
        >
            Entrar
        </button>

    </div>

</section>



<!-- SISTEMA -->

<main id="sistema" class="hidden">

    <div class="menu">

        <button onclick="mostrarTela('dashboard')">
            🏠 Início
        </button>

        <button onclick="mostrarTela('jogadores')">
            👥 Jogadores
        </button>

        <button onclick="mostrarTela('partidas')">
            ⚽ Partidas
        </button>

        <button onclick="mostrarTela('escalacao')">
            📋 Escalação
        </button>

        <button onclick="mostrarTela('votacao')">
            ⭐ Votação
        </button>

        <button onclick="mostrarTela('ranking')">
            🏆 Ranking
        </button>

    </div>



    <!-- DASHBOARD -->

    <section id="dashboard" class="tela">

        <div class="card">

            <h1>Futebol ID</h1>

            <p>
                Bem-vindo ao sistema.
            </p>

            <div class="grid">

                <div class="card">

                    <h3>
                        👥 Jogadores
                    </h3>

                    <h2 id="totalJogadores">
                        0
                    </h2>

                </div>


                <div class="card">

                    <h3>
                        ⚽ Partidas
                    </h3>

                    <h2 id="totalPartidas">
                        0
                    </h2>

                </div>


                <div class="card">

                    <h3>
                        🏆 Ranking
                    </h3>

                    <h2>
                        Ver ranking
                    </h2>

                    <button
                        onclick="mostrarTela('ranking')"
                    >
                        Abrir
                    </button>

                </div>

            </div>

        </div>

    </section>



    <!-- JOGADORES -->

    <section
        id="jogadores"
        class="tela hidden"
    >

        <div class="card">

            <h1>
                👥 Jogadores
            </h1>

            <button onclick="mostrarCadastro()">
                + Novo jogador
            </button>


            <div
                id="formJogador"
                class="hidden"
            >

                <h3>
                    Cadastro
                </h3>

                <input
                    id="jNome"
                    placeholder="Nome"
                >

                <input
                    id="jApelido"
                    placeholder="Apelido"
                >

                <select id="jPosicao">

                    <option value="">
                        Posição
                    </option>

                    <option>
                        Goleiro
                    </option>

                    <option>
                        Zagueiro
                    </option>

                    <option>
                        Lateral
                    </option>

                    <option>
                        Volante
                    </option>

                    <option>
                        Meia
                    </option>

                    <option>
                        Ponta
                    </option>

                    <option>
                        Atacante
                    </option>

                </select>

                <input
                    id="jNumero"
                    placeholder="Número"
                >

                <input
                    id="jEmail"
                    placeholder="E-mail"
                >

                <input
                    id="jSenha"
                    type="password"
                    placeholder="Senha"
                >

                <button
                    onclick="cadastrarJogador()"
                >
                    Salvar jogador
                </button>

                <button
                    class="btn-secondary"
                    onclick="esconderCadastro()"
                >
                    Cancelar
                </button>

            </div>


            <div id="listaJogadores"></div>

        </div>

    </section>



    <!-- PARTIDAS -->

    <section
        id="partidas"
        class="tela hidden"
    >

        <div class="card">

            <h1>
                ⚽ Partidas
            </h1>

            <h3>
                Nova partida
            </h3>

            <label>
                Data
            </label>

            <input
                id="pData"
                type="date"
            >

            <label>
                Hora
            </label>

            <input
                id="pHora"
                type="time"
            >

            <label>
                Adversário
            </label>

            <input
                id="pAdversario"
                placeholder="Nome do adversário"
            >

            <label>
                Local
            </label>

            <input
                id="pLocal"
                placeholder="Local da partida"
            >

            <button onclick="criarPartida()">
                Criar partida
            </button>

        </div>


        <div class="card">

            <h2>
                Partidas cadastradas
            </h2>

            <div id="listaPartidas"></div>

        </div>

    </section>



    <!-- ESCALAÇÃO -->

    <section
        id="escalacao"
        class="tela hidden"
    >

        <div class="card">

            <h1>
                📋 Escalação
            </h1>

            <label>
                Partida
            </label>

            <select
                id="selectPartidaEscala"
                onchange="carregarEscalados()"
            >
            </select>


            <h3>
                Adicionar jogador
            </h3>

            <select
                id="selectJogadorEscala"
            >
            </select>

            <button onclick="escalarJogador()">
                Escalar jogador
            </button>

            <div id="listaEscalados"></div>

        </div>

    </section>



    <!-- VOTAÇÃO -->

    <section
        id="votacao"
        class="tela hidden"
    >

        <div class="card">

            <h1>
                ⭐ Votação
            </h1>

            <label>
                Partida
            </label>

            <select
                id="selectPartidaVoto"
                onchange="carregarVotacao()"
            >
            </select>

            <div id="painelVotacao"></div>

        </div>

    </section>



    <!-- RANKING -->

    <section
        id="ranking"
        class="tela hidden"
    >

        <div class="card">

            <h1>
                🏆 Ranking
            </h1>

            <button onclick="carregarRanking()">
                Atualizar ranking
            </button>

            <div id="listaRanking"></div>

        </div>

    </section>

</main>



<script>

/*******************************************************
 * CONFIGURAÇÃO
 *******************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbzd-B7jCN_YhM7QOh_cHvad-4icVrTAuMQ_gp2Xx7y95ctNO5258G2-zLfwWWq2C1sN/exec";


let usuario = null;

let jogadores = [];

let partidas = [];

let escalados = [];



/*******************************************************
 * API
 *******************************************************/

async function api(acao, parametros = {}) {

    const params =
        new URLSearchParams();

    params.append(
        "acao",
        acao
    );

    Object.keys(parametros).forEach(
        chave => {

            params.append(
                chave,
                parametros[chave] ?? ""
            );

        }
    );

    const resposta =
        await fetch(
            API_URL +
            "?" +
            params.toString()
        );

    const texto =
        await resposta.text();

    console.log(
        "Resposta API:",
        texto
    );

    try {

        return JSON.parse(texto);

    } catch (erro) {

        return {
            ok: false,
            mensagem:
                "Resposta inválida do servidor: " +
                texto
        };

    }

}



/*******************************************************
 * LOGIN
 *******************************************************/

async function login() {

    const usuarioInput =
        document
            .getElementById("loginUsuario")
            .value
            .trim();

    const senha =
        document
            .getElementById("loginSenha")
            .value
            .trim();

    const mensagem =
        document.getElementById(
            "loginMensagem"
        );

    const botao =
        document.getElementById(
            "btnLogin"
        );


    if (!usuarioInput || !senha) {

        mensagem.innerHTML =
            `<div class="alert">
                ⚠️ Digite usuário e senha.
            </div>`;

        return;

    }


    mensagem.innerHTML =
        `<div class="alert">
            ⏳ Entrando...
        </div>`;

    botao.disabled = true;


    try {

        /*
         * CORREÇÃO PRINCIPAL:
         *
         * O Apps Script espera "usuario",
         * e não "email".
         */

        const resultado =
            await api(
                "login",
                {
                    usuario: usuarioInput,
                    senha: senha
                }
            );


        console.log(
            "Resultado login:",
            resultado
        );


        if (!resultado.ok) {

            mensagem.innerHTML =
                `<div class="alert">
                    ❌ ${
                        resultado.mensagem ||
                        resultado.erro ||
                        "Usuário ou senha incorretos."
                    }
                </div>`;

            botao.disabled = false;

            return;

        }


        /*
         * CORREÇÃO:
         *
         * O Apps Script retorna "usuario",
         * e não "jogador".
         */

        usuario =
            resultado.usuario;


        if (!usuario) {

            mensagem.innerHTML =
                `<div class="alert">
                    ❌ O servidor aceitou o login,
                    mas não retornou os dados do usuário.
                </div>`;

            botao.disabled = false;

            return;

        }


        localStorage.setItem(
            "futebolID_usuario",
            JSON.stringify(usuario)
        );


        mensagem.innerHTML =
            `<div class="alert">
                ✅ Login realizado!
            </div>`;


        entrarSistema();


    } catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );

        mensagem.innerHTML =
            `<div class="alert">
                ❌ Erro de conexão com o servidor.
                <br><br>
                Verifique se a implantação do Apps Script
                está atualizada.
            </div>`;

    }


    botao.disabled = false;

}



/*******************************************************
 * ENTRAR NO SISTEMA
 *******************************************************/

function entrarSistema() {

    document
        .getElementById("telaLogin")
        .classList.add("hidden");


    document
        .getElementById("topo")
        .classList.remove("hidden");


    document
        .getElementById("sistema")
        .classList.remove("hidden");


    document
        .getElementById("usuarioNome")
        .textContent =
        usuario.nome ||
        usuario.apelido ||
        "Usuário";


    carregarTudo();

}



/*******************************************************
 * LOGOUT
 *******************************************************/

function logout() {

    localStorage.removeItem(
        "futebolID_usuario"
    );

    usuario = null;

    location.reload();

}



/*******************************************************
 * TELAS
 *******************************************************/

function mostrarTela(id) {

    document
        .querySelectorAll(".tela")
        .forEach(
            tela => {
                tela.classList.add(
                    "hidden"
                );
            }
        );


    const tela =
        document.getElementById(id);


    if (tela) {

        tela.classList.remove(
            "hidden"
        );

    }


    if (id === "jogadores") {
        carregarJogadores();
    }


    if (id === "partidas") {
        carregarPartidas();
    }


    if (id === "escalacao") {
        carregarDadosEscalacao();
    }


    if (id === "votacao") {
        carregarDadosVotacao();
    }


    if (id === "ranking") {
        carregarRanking();
    }

}



/*******************************************************
 * CARREGAR TUDO
 *******************************************************/

async function carregarTudo() {

    try {

        await carregarJogadores();

    } catch (erro) {

        console.error(
            "Erro jogadores:",
            erro
        );

    }


    try {

        await carregarPartidas();

    } catch (erro) {

        console.error(
            "Erro partidas:",
            erro
        );

    }


    atualizarDashboard();

}



/*******************************************************
 * JOGADORES
 *******************************************************/

async function carregarJogadores() {

    const resultado =
        await api("jogadores");


    if (!resultado.ok) {

        console.error(
            resultado.mensagem
        );

        return;

    }


    jogadores =
        resultado.jogadores || [];


    atualizarDashboard();

    renderJogadores();

    preencherJogadoresEscala();

}



function renderJogadores() {

    const div =
        document.getElementById(
            "listaJogadores"
        );


    if (!jogadores.length) {

        div.innerHTML =
            "<p>Nenhum jogador cadastrado.</p>";

        return;

    }


    let html =
        `<table>

            <tr>
                <th>Nome</th>
                <th>Apelido</th>
                <th>Posição</th>
                <th>Número</th>
                <th>Ações</th>
            </tr>`;


    jogadores
        .filter(
            j =>
                String(
                    j.ATIVO ||
                    j.ativo ||
                    ""
                ).toUpperCase() === "SIM"
        )
        .forEach(
            j => {

                const id =
                    j.ID ||
                    j.id ||
                    "";

                const nome =
                    j.NOME ||
                    j.nome ||
                    "";

                const apelido =
                    j.APELIDO ||
                    j.apelido ||
                    "";

                const posicao =
                    j.POSICAO ||
                    j.posicao ||
                    "";

                const numero =
                    j.NUMERO ||
                    j.numero ||
                    "";


                html += `
                    <tr>

                        <td>
                            ${nome}
                        </td>

                        <td>
                            ${apelido || "-"}
                        </td>

                        <td>
                            ${posicao || "-"}
                        </td>

                        <td>
                            ${numero || "-"}
                        </td>

                        <td>

                            <button
                                onclick="desativarJogador('${id}')"
                                class="btn-danger"
                            >
                                Desativar
                            </button>

                        </td>

                    </tr>
                `;

            }
        );


    html += "</table>";

    div.innerHTML = html;

}



function mostrarCadastro() {

    document
        .getElementById(
            "formJogador"
        )
        .classList.remove(
            "hidden"
        );

}



function esconderCadastro() {

    document
        .getElementById(
            "formJogador"
        )
        .classList.add(
            "hidden"
        );

}



/*******************************************************
 * CADASTRAR JOGADOR
 *******************************************************/

async function cadastrarJogador() {

    const resultado =
        await api(
            "criar_jogador",
            {
                nome:
                    document.getElementById(
                        "jNome"
                    ).value,

                apelido:
                    document.getElementById(
                        "jApelido"
                    ).value,

                posicao:
                    document.getElementById(
                        "jPosicao"
                    ).value,

                numero:
                    document.getElementById(
                        "jNumero"
                    ).value,

                email:
                    document.getElementById(
                        "jEmail"
                    ).value,

                senha:
                    document.getElementById(
                        "jSenha"
                    ).value
            }
        );


    alert(
        resultado.ok
            ? "Jogador cadastrado!"
            : (
                resultado.mensagem ||
                resultado.erro ||
                "Erro ao cadastrar jogador."
            )
    );


    if (resultado.ok) {

        document.getElementById(
            "jNome"
        ).value = "";

        document.getElementById(
            "jApelido"
        ).value = "";

        document.getElementById(
            "jPosicao"
        ).value = "";

        document.getElementById(
            "jNumero"
        ).value = "";

        document.getElementById(
            "jEmail"
        ).value = "";

        document.getElementById(
            "jSenha"
        ).value = "";


        esconderCadastro();

        carregarJogadores();

    }

}



/*******************************************************
 * DESATIVAR JOGADOR
 *******************************************************/

async function desativarJogador(id) {

    if (
        !confirm(
            "Deseja desativar este jogador?"
        )
    ) {
        return;
    }


    alert(
        "A função de desativar jogador será conectada ao backend."
    );

}



/*******************************************************
 * PARTIDAS
 *******************************************************/

async function carregarPartidas() {

    const resultado =
        await api("partidas");


    if (!resultado.ok) {

        console.error(
            resultado.mensagem
        );

        partidas = [];

        atualizarDashboard();

        return;

    }


    partidas =
        resultado.partidas || [];


    atualizarDashboard();

    renderPartidas();

    preencherPartidas();

}



function renderPartidas() {

    const div =
        document.getElementById(
            "listaPartidas"
        );


    if (!partidas.length) {

        div.innerHTML =
            "<p>Nenhuma partida cadastrada.</p>";

        return;

    }


    let html =
        `<table>

            <tr>
                <th>Data</th>
                <th>Hora</th>
                <th>Adversário</th>
                <th>Local</th>
            </tr>`;


    partidas.forEach(
        p => {

            html += `
                <tr>

                    <td>
                        ${p.data || p.DATA || "-"}
                    </td>

                    <td>
                        ${p.hora || p.HORA || "-"}
                    </td>

                    <td>
                        ${
                            p.adversario ||
                            p.ADVERSARIO ||
                            p.TIME_B ||
                            "-"
                        }
                    </td>

                    <td>
                        ${p.local || p.LOCAL || "-"}
                    </td>

                </tr>
            `;

        }
    );


    html += "</table>";

    div.innerHTML = html;

}



/*******************************************************
 * CRIAR PARTIDA
 *******************************************************/

async function criarPartida() {

    alert(
        "A estrutura de partidas será conectada ao backend na próxima etapa."
    );

}



/*******************************************************
 * ESCALAÇÃO
 *******************************************************/

function preencherPartidas() {

    const selects = [
        "selectPartidaEscala",
        "selectPartidaVoto"
    ];


    selects.forEach(
        id => {

            const select =
                document.getElementById(id);


            if (!select) {
                return;
            }


            select.innerHTML =
                `<option value="">
                    Selecione uma partida
                </option>`;


            partidas.forEach(
                p => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        p.id ||
                        p.ID ||
                        "";


                    option.textContent =
                        `${
                            p.data ||
                            p.DATA ||
                            ""
                        } - ${
                            p.adversario ||
                            p.ADVERSARIO ||
                            p.TIME_B ||
                            "Partida"
                        }`;


                    select.appendChild(
                        option
                    );

                }
            );

        }
    );

}



function preencherJogadoresEscala() {

    const select =
        document.getElementById(
            "selectJogadorEscala"
        );


    if (!select) {
        return;
    }


    select.innerHTML =
        `<option value="">
            Selecione o jogador
        </option>`;


    jogadores
        .filter(
            j =>
                String(
                    j.ATIVO ||
                    j.ativo ||
                    ""
                ).toUpperCase() === "SIM"
        )
        .forEach(
            j => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    j.ID ||
                    j.id ||
                    "";


                option.textContent =
                    `${
                        j.NOME ||
                        j.nome ||
                        ""
                    } - ${
                        j.POSICAO ||
                        j.posicao ||
                        ""
                    }`;


                select.appendChild(
                    option
                );

            }
        );

}



function carregarDadosEscalacao() {

    preencherPartidas();

    preencherJogadoresEscala();

/*******************************************************
 * INICIALIZAÇÃO
 *******************************************************/

window.addEventListener(
    "load",
    async function() {

        /*
         * Primeiro verifica se já existe
         * um login salvo.
         */

        const salvo =
            localStorage.getItem(
                "futebolID_usuario"
            );


        if (salvo) {

            try {

                usuario =
                    JSON.parse(
                        salvo
                    );


                if (usuario) {

                    entrarSistema();

                    return;

                }

            } catch (erro) {

                console.error(
                    erro
                );

                localStorage.removeItem(
                    "futebolID_usuario"
                );

            }

        }


        /*
         * Testa o backend.
         */

        try {

            const resultado =
                await api("status");


            console.log(
                "Futebol ID:",
                resultado
            );


        } catch (erro) {

            console.error(
                "Backend indisponível:",
                erro
            );

        }

    }
);

</script>
